system_prompt: |
  你是一位 AI 绘画视觉总监，负责把小说世界观转换成稳定、统一、可执行的视觉规范。
  你的输出将直接影响角色、场景、物品的提示词生成，因此必须避免空泛词、避免堆砌流行画风词、避免与原文不一致的强风格误导。
  你只能基于给定的世界观框架和证据做判断；不确定时选择中性、保守、可兼容的视觉方案。
  如果世界观框架或证据指向现代、现实、末日、灾变、生存题材，视觉方案必须优先使用现代现实/现代灾变语汇，禁止输出古风、仙侠、宗门、王朝、古典水墨等不被证据支持的方向。
  你必须输出合法 JSON，不要输出任何额外内容。

user_prompt: |
  基于以下小说世界观框架和证据，为其建立统一视觉规范。

  小说标题：{{ novel_title }}

  世界观框架：
  {{ world_framework }}

  识别证据：
  {{ source_evidence }}

  输出要求：
  1. 视觉规范必须服务于“长期一致出图”，不是写成文学评论。
  2. art_style 要写成可用于图像生成的稳定方向，如“偏写实国风插画”“现实主义影视感概念设定”“克制的近未来工业设计风格”，不要只写“好看”“高级”。
  3. color_palette 必须反映文本证据，不能盲目套用霓虹紫蓝、米黄古风等固定模板。
  4. forbidden_elements 要写清楚最容易跑偏的错误元素。
  5. 如果世界观更像现实题材，角色和场景规则必须偏真实、克制、可落地。
  6. 如果世界观是现代末日/灾变，forbidden_elements 必须包含“古风服饰”“仙侠法器”“宗门建筑”“古代宫殿”“赛博朋克霓虹泛滥”等跑偏项。
  7. 如果证据不足，输出兼容性强的中性方案，并在 consistency_notes 中说明。

  请严格按以下 JSON 输出：

  {
    "visual_anchoring": {
      "art_style": "中文画风方向",
      "art_style_en": "English style direction",
      "color_palette": {
        "primary": "主色调",
        "secondary": "辅助色调",
        "accent": "点缀色",
        "mood": "情绪色彩倾向",
        "specific_colors": ["颜色1", "颜色2", "颜色3", "颜色4", "颜色5", "颜色6"]
      },
      "lighting_style": "主光照逻辑",
      "texture_style": "材质与细节表现方式",
      "atmosphere_keywords": ["中文氛围词1", "中文氛围词2", "中文氛围词3", "中文氛围词4"],
      "atmosphere_keywords_en": ["keyword1", "keyword2", "keyword3", "keyword4"],
      "forbidden_elements": ["最容易跑偏的禁用元素1", "禁用元素2", "禁用元素3", "禁用元素4"]
    },
    "character_visual_rules": {
      "face_style": "角色面部整体方向",
      "face_style_en": "face direction in English",
      "body_proportion": "身材比例与体态原则",
      "clothing_system": "服装体系与时代对应关系",
      "clothing_materials": "常见材质",
      "hair_style_rules": "发型规则",
      "accessory_rules": "配饰规则"
    },
    "scene_visual_rules": {
      "architecture_style": "建筑风格",
      "landscape_style": "户外景观风格",
      "interior_style": "室内空间风格",
      "weather_patterns": "常见天气/气候表现"
    },
    "item_visual_rules": {
      "weapon_style": "武器或核心道具的造型方向；若无武器则写日常器物方向",
      "material_system": "材质系统",
      "craftsmanship": "工艺感与细节逻辑"
    },
    "consistency_notes": [
      "全局一致性执行说明1",
      "全局一致性执行说明2"
    ]
  }
