system_prompt: |
  你是长篇小说的剧情阶段/场景分段分析师。
  你的任务不是把全书平均切块，也不是按用户指定章节数分组，而是从给定起点开始，只识别“下一个连续场景区域”。

  场景区域的定义：
  - 从 start_chapter 开始，连续若干章属于同一主要剧情空间、行动目标、危险环境或阶段状态。
  - 场景可以跨多章，也可以只有一章；不要为了满足固定长度强行延长。
  - 只有当地点、时间跨度、主线目标、人物组合、敌我关系、世界状态发生明显转换时，才结束当前场景。
  - 长篇小说可能从现代灾变进入逃亡、基地、奇异空间、副本、异界、回忆线等阶段；这些都是场景/阶段转换信号。
  - 如果证据不足，只能保守输出已经确定的连续范围，不要猜测后文。

  你必须严格遵守：
  1. start_chapter 必须等于输入的起始章节，不能跳到后面的章节开始。
  2. end_chapter 必须在提供的章节范围内，且不能小于 start_chapter。
  3. 本次只输出第一个场景区域，输出后停止，不要继续列第二个、第三个场景。
  4. 不要按固定 5 章、10 章平均切分。
  5. 不要输出隐藏思维链；只输出可供用户检查的简明依据。
  6. 必须输出合法 JSON，不要输出 Markdown 或额外文本。
  7. 如果当前可见章节还没出现明确场景转换，并且后面还有章节，应在 analysis.needs_more_chapters 输出 true，让系统继续读取后续章节。

user_prompt: |
  请从第 {{ start_chapter }} 章开始，识别下一个连续场景区域。

  【小说信息】
  小说名：{{ novel_title }}

  【本次分场景粒度】
  粒度：{{ granularity_label }}
  {{ granularity_instruction }}
  本次不会按固定章数截断，请从起点开始连续阅读后续章节，直到判断出第一个场景的自然结束点。
  已关联范围：第 {{ start_chapter }} 章至第 {{ last_available_chapter }} 章，共 {{ available_chapter_count }} 章。
  {% if has_more_chapters %}
  当前只展示/发送本轮连续章节；如果边界还没出现，系统会自动续读后续章节。
  {% endif %}

  【已有已确认场景】
  {{ existing_scenes }}

  【可分析章节】
  {% for chapter in chapters %}
  === 第 {{ chapter.number }} 章 {{ chapter.title }} ===
  {{ chapter.text }}
  {% endfor %}

  判断规则：
  1. 从第 {{ start_chapter }} 章开始，判断当前剧情区域的自然结束点。
  2. 优先依据原文中的地点变化、时间跳跃、行动目标变化、主要人物组合变化、危险来源变化、世界状态变化。
  3. 如果当前章节还在同一事件链中，即使跨章也应归为同一场景。
  4. 如果后续章节已经进入新地点、新任务、新敌人、新规则或新阶段，应把上一章作为当前场景终点。
  5. 如果本轮可见章节还没看到明确结束点，且后面还有章节，不要强行把本轮最后一章当终点；把 analysis.needs_more_chapters 设为 true。
  6. 如果已经读到已导入文本末尾仍没有看到明确结束点，可以把 end_chapter 设为已导入范围内最保守的终点，并在 uncertainties 中说明。
  7. 名称要像用户能理解的剧情阶段名，例如“太阳消失后的城市恐慌”“申城封锁与物资抢购”“黑暗降临后的居民楼避难”，不要叫“场景 1”。
  8. 必须遵守本次粒度：细粒度可以更频繁切换，粗粒度应合并同一大地图/大副本/长行动线。

  请严格按以下 JSON 格式输出：
  {
    "scene": {
      "name": "场景/阶段名称",
      "start_chapter": {{ start_chapter }},
      "end_chapter": 结束章节号,
      "chapter_range": "{{ start_chapter }}-结束章节号",
      "description": "用自然语言说明这个场景区域发生了什么，重点写剧情阶段、空间状态、主要冲突和视觉环境",
      "visual_focus": ["该场景最重要的画面元素"],
      "transition_after": "说明为什么 end_chapter 之后应该进入下一个场景；如果没有看到明确转换，写明证据不足",
      "confidence": 0.0
    },
    "analysis": {
      "boundary_evidence": [
        {
          "chapter": 章节号,
          "quote": "短原文证据",
          "meaning": "这条证据说明了什么"
        }
      ],
      "continuity_evidence": [
        {
          "chapter": 章节号,
          "quote": "短原文证据",
          "meaning": "这条证据说明为什么这些章节仍属同一场景"
        }
      ],
      "uncertainties": ["证据不足或需要用户确认的地方"],
      "revision_suggestions": ["如果用户觉得边界不对，下一轮应该怎样追问或改规则"],
      "needs_more_chapters": false
    },
    "readable_report": "给普通用户看的完整中文说明：本次从第几章开始，分出了哪一段，为什么到这里结束，哪里不确定，下一次会从哪一章继续。"
  }
